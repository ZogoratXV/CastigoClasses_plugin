default-class: mago
max-level: 100
xp:
  base: 100
  growth: 1.18
  vanilla-multiplier: 1.0
combat:
  pvp: false
  global-cooldown-ms: 350
  strength-melee-factor: 0.5
  dexterity-speed-factor: 0.005
autosave-seconds: 60
stat-points:
  # Punti ai livelli 2, 4, 6... (ogni 1 = dal livello 2 in poi).
  every-levels: 2
  points-per-award: 1
  # Bonus all'attributo per ogni punto speso; 0 disabilita quell'assegnazione.
  per-point:
    strength: 1
    dexterity: 1
    health: 2
    mana: 5
    intelligence: 1
    attack: 1
    defense: 1
